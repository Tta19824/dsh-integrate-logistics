name: OrderPocket
options:
  bundleIdPrefix: com.abdd
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"

targets:
  OrderPocket:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - sdk: libsqlite3.tbd
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: OrderPocket
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: zh_CN
        UILaunchScreen:
          UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        NSPhotoLibraryAddUsageDescription: "保存拼多多登录二维码到相册，方便用拼多多 App 扫码登录"
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.abdd.orderpocket.refresh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abdd.orderpocket
        PRODUCT_NAME: OrderPocket
        MARKETING_VERSION: 0.32.0
        CURRENT_PROJECT_VERSION: 178
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_BITCODE: NO

schemes:
  OrderPocket:
    build:
      targets:
        OrderPocket: all
    run:
      config: Debug
    archive:
      config: Release
