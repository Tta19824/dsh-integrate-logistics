name: OrderPocket
options:
  bundleIdPrefix: com.abdd
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"

targets:
  OrderPocket:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abdd.orderpocket
        PRODUCT_NAME: OrderPocket
        MARKETING_VERSION: 0.17.9
        CURRENT_PROJECT_VERSION: 85
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: OrderPocket
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        ENABLE_BITCODE: NO
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "保存拼多多登录二维码到相册，方便用拼多多 App 扫码登录"

schemes:
  OrderPocket:
    build:
      targets:
        OrderPocket: all
    run:
      config: Debug
    archive:
      config: Release
