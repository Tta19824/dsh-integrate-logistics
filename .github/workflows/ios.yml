name: build-ipa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: probe
        run: echo "ci-probe ok"

  build:
    runs-on: macos-15-intel
    timeout-minutes: 30

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: env info
        run: |
          xcodebuild -version || true
          ls /Applications | grep -i xcode || true

      - name: install xcodegen
        run: brew install xcodegen

      - name: generate project
        run: xcodegen generate

      - name: build
        run: |
          set -o pipefail
          xcodebuild \
            -project OrderPocket.xcodeproj \
            -scheme OrderPocket \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: pack ipa
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/OrderPocket.app"
          test -d "$APP_PATH"
          rm -rf Payload OrderPocket.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry OrderPocket.ipa Payload
          ls -lh OrderPocket.ipa
          lipo -info Payload/OrderPocket.app/OrderPocket || true

      - name: upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: OrderPocket-ipa
          path: OrderPocket.ipa
          retention-days: 30

      - name: release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: smoke
          name: smoke
          body: unsigned ipa for sideloading
          files: OrderPocket.ipa
